name: maskposenet_union_mg_synth_isaac

camera:
  width_px: 640
  height_px: 360
  # Training labels carry per-frame K; these are only nominal fallbacks.
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 180.0

model:
  # Keep 3 channels so the GatePoseNet-MG encoder architecture is unchanged.
  # The union mask is repeated across all three channels; this is not RGB imagery.
  in_channels: 3
  base_channels: [16, 32, 64, 128, 256]
  width_factor: 2
  n_queries: 8
  d_model: 128
  n_dec_layers: 2
  n_heads: 4
  temporal_highres: true
  multiscale_memory: true
  mask_stride: 2

data:
  sources:
    - name: synthetic
      root: ../data/synth_large_0906
      train_manifest: splits/train_sequences.txt
      val_manifest: splits/validation_sequences.txt
      test_manifest: splits/test_sequences.txt
    - name: isaac
      root: ../data/refined_isaac_0908
      train_manifest: splits/train_sequences.txt
      val_manifest: splits/validation_sequences.txt
      test_manifest: splits/test_sequences.txt

  # In this fork, instance_color mode is preprocessed into a binary UNION mask:
  # all non-zero instance IDs become foreground=1 before entering the network.
  # Per-instance GT supervision is still preserved internally for the output losses.
  input_mode: instance_color
  randomize_instance_colors: false
  window: 8
  stride: 4
  val_stride: 8
  test_stride: 8
  height: 192
  width: 320
  native_width: 640
  native_height: 360
  pose_sup_max_m: 25.0
  nominal_focal: 320.0
  ego_dropout: 0.25
  max_gates: 8
  mask_stride: 2
  preserve_small_masks: true

train:
  epochs: 60
  batch_size: 12
  lr: 0.0007
  weight_decay: 0.01
  num_workers: 8
  amp: true
  grad_clip: 1.0
  seed: 42
  log_interval: 20

schedule:
  milestones: [24, 44, 54]
  gamma: 0.31622776601

loss:
  w_presence: 2.0
  w_mask: 2.0
  w_corners: 5.0
  w_corner_in: 0.5
  w_center: 5.0
  w_position: 2.0
  w_depth: 2.0
  w_rot: 2.0
  w_visfrac: 0.5
  w_target: 1.0
  blind_scale: 0.3
  symmetry_aware: true
  far_start_m: 8.0

selection:
  metric: far_balanced_score
  far_recall_weight_m: 0.75
  gate_recall_weight_m: 0.25

tuning:
  trials: 20
  epochs_per_trial: 15
  seed: 42
  objective: latency_constrained_far_balanced_score
  window_choices: [4, 6, 8, 10, 12, 16]
  # Desktop proxy target. Optuna rejects configurations slower than this.
  # Re-benchmark against TensorRT on Orin NX before final deployment.
  max_5090_step_ms: 2.5
  latency_warmup: 40
  latency_iters: 120

output:
  dir: ../runs_union
