name: maskposenet_union_noise_mg_synth_isaac
camera:
  width_px: 640
  height_px: 360
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 180.0
model:
  in_channels: 3
  base_channels:
  - 16
  - 32
  - 64
  - 128
  - 256
  width_factor: 2
  n_queries: 8
  d_model: 128
  n_dec_layers: 2
  n_heads: 4
  temporal_highres: true
  multiscale_memory: true
  mask_stride: 2
data:
  sources:
  - name: synthetic
    root: ../data/synth_large_0906
    train_manifest: splits/train_sequences.txt
    val_manifest: splits/validation_sequences.txt
    test_manifest: splits/test_sequences.txt
  - name: isaac
    root: ../data/refined_isaac_0908
    train_manifest: splits/train_sequences.txt
    val_manifest: splits/validation_sequences.txt
    test_manifest: splits/test_sequences.txt
  input_mode: instance_color
  randomize_instance_colors: false
  window: 8
  stride: 4
  val_stride: 8
  test_stride: 8
  height: 192
  width: 320
  native_width: 640
  native_height: 360
  pose_sup_max_m: 25.0
  nominal_focal: 320.0
  ego_dropout: 0.23946339367881464
  max_gates: 8
  mask_stride: 2
  preserve_small_masks: true
  mask_noise:
    enabled: true
    clean_window_prob: 0.18
    severity_min: 0.25
    severity_max: 0.9
    rounded_edge_prob: 0.65
    rounded_kernel_max: 7
    morph_prob: 0.55
    max_shift_px: 3.0
    incomplete_prob: 0.72
    max_missing_chunks: 3
    gate_dropout_prob: 0.055
    full_frame_dropout_prob: 0.015
    persistent_false_artifact_prob: 0.38
    max_persistent_false_artifacts: 2
    small_false_blob_prob: 0.24
    max_small_false_blobs: 3
  train_manifest: splits/train_sequences.txt
  val_manifest: splits/validation_sequences.txt
train:
  epochs: 60
  batch_size: 16
  lr: 0.00039575457779638784
  weight_decay: 0.03285970816964246
  num_workers: 16
  amp: true
  grad_clip: 1.5979909127171077
  seed: 42
  log_interval: 20
schedule:
  milestones:
  - 24
  - 44
  - 54
  gamma: 0.31622776601
loss:
  w_presence: 1.4680559213273097
  w_mask: 1.4679835610086078
  w_corners: 2.3485016730091965
  w_corner_in: 0.5
  w_center: 5.0
  w_position: 4.46470458309974
  w_depth: 2.6039025411012306
  w_rot: 2.9782540222861593
  w_visfrac: 0.5
  w_target: 0.5514612357395061
  blind_scale: 0.3
  symmetry_aware: true
  far_start_m: 8.0
selection:
  metric: far_balanced_score
  far_recall_weight_m: 0.75
  gate_recall_weight_m: 0.25
tuning:
  trials: 12
  epochs_per_trial: 10
  seed: 42
  objective: far_balanced_score
  window_choices:
  - 8
  max_5090_step_ms: 1000.0
  latency_warmup: 20
  latency_iters: 40
output:
  dir: ''
