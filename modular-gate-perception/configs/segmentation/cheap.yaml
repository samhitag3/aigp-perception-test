seed: 42
dataset:
  root: ../data/perception_dataset_v1
  width: 640
  height: 360
  train_splits: [train]
  val_splits: [validation]
  max_train_sequences: 8
  max_val_sequences: 2
model:
  window_size: 3
  num_queries: 8
  hidden_dim: 96
  track_dim: 48
  decoder_layers: 2
  nheads: 4
  pretrained_backbone: true
training:
  epochs: 3
  batch_size: 4
  val_batch_size: 4
  num_workers: 4
  learning_rate: 0.0002
  weight_decay: 0.0001
  amp: true
  grad_clip_norm: 1.0
augmentation:
  enabled: true
  brightness: [0.80, 1.20]
  contrast: [0.80, 1.20]
  saturation: [0.75, 1.25]
  hue_shift_deg: [-8.0, 8.0]
  gamma: [0.85, 1.15]
  zoom: [0.90, 1.12]
  rotation_deg: [-4.0, 4.0]
  translation_fraction: [0.05, 0.05]
  blur_probability: 0.20
  blur_sigma: [0.0, 1.2]
  noise_std: [0.0, 8.0]
loss:
  object_weight: 1.0
  object_pos_weight: 2.0
  mask_bce_weight: 2.0
  mask_dice_weight: 3.0
  box_weight: 1.0
  track_weight: 0.25
  track_margin: 0.2
  cost_mask_bce: 1.0
  cost_mask_dice: 2.0
  cost_box: 1.0
  cost_object: 0.5
