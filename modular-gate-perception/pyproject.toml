[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gateperception"
version = "0.1.0"
description = "Modular temporal UAV gate perception: instance segmentation, keypoints, and PnP pose"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "numpy>=1.26",
  "pillow>=10.3",
  "PyYAML>=6.0",
  "opencv-python-headless>=4.10",
  "scipy>=1.13",
  "tqdm>=4.66",
  "optuna>=4.0",
  "pandas>=2.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gate-validate-dataset = "gateperception.data.validate:main"
