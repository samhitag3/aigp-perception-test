gate:
  gate_type_id: standard_gate
  outer_width_m: 2.7
  outer_height_m: 2.7
  inner_width_m: 1.5
  inner_height_m: 1.5
  depth_m: 0.26
  keypoint_reference_surface: approach_face
  keypoint_order:
    - outer_tl
    - outer_tr
    - outer_br
    - outer_bl
    - inner_tl
    - inner_tr
    - inner_br
    - inner_bl
  # Gate-local frame from the canonical contract: x right, y down, z through gate.
  # Keypoints are on the approach face at z=-depth/2.
  keypoints_gate_frame_m:
    outer_tl: [-1.35, -1.35, -0.13]
    outer_tr: [ 1.35, -1.35, -0.13]
    outer_br: [ 1.35,  1.35, -0.13]
    outer_bl: [-1.35,  1.35, -0.13]
    inner_tl: [-0.75, -0.75, -0.13]
    inner_tr: [ 0.75, -0.75, -0.13]
    inner_br: [ 0.75,  0.75, -0.13]
    inner_bl: [-0.75,  0.75, -0.13]
