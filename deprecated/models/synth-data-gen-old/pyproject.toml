[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatesynth"
version = "0.2.0"
description = "Sequence-consistent synthetic UAV gate perception dataset generator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "tqdm>=4.66"
]

[project.optional-dependencies]
gpu = [
  "torch>=2.1"
]

[tool.setuptools.packages.find]
where = ["src"]
