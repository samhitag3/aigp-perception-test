seed: 42
output_root: ./generated/gate_perception_smoke_diverse_v1
dataset_id: gate_perception_smoke_diverse_v1
schema_version: 1.0.0

image:
  width: 640
  height: 360
  jpeg_quality: 93

camera:
  model: pinhole
  width: 640
  height: 360

  fx: 417.0321193091858
  fy: 417.0321193091858

  cx: 320.0
  cy: 180.0

  hfov_deg: 75.0

  shutter:
    type: rolling
    readout_time_s: null
    exposure_time_s: null

  distortion:
    enabled: false

  randomization:
    resolution: false
    focal_length: false
    principal_point: false
    distortion: false

sequences:
  count: 12
  fps: 60.0

course:
  gates_min: 3
  gates_max: 5
  course_spacing_m: [4.0, 8.0]
  gate_height_m: [0.9, 2.8]
  gate_yaw_deg: [-35.0, 35.0]
  gate_pitch_deg: [-15.0, 15.0]
  gate_roll_deg: [-12.0, 12.0]

  course_style_probabilities:
    straight: 0.10
    flowing: 0.45
    technical: 0.30
    aggressive: 0.15

  course_styles:
    straight:
      turn_deg: [-5.0, 5.0]
      vertical_step_m: [-0.10, 0.10]
      hard_turn_probability: 0.0
      hard_turn_deg: [-5.0, 5.0]
    flowing:
      turn_deg: [-20.0, 20.0]
      vertical_step_m: [-0.25, 0.25]
      hard_turn_probability: 0.08
      hard_turn_deg: [-35.0, 35.0]
    technical:
      turn_deg: [-35.0, 35.0]
      vertical_step_m: [-0.40, 0.40]
      hard_turn_probability: 0.22
      hard_turn_deg: [-55.0, 55.0]
    aggressive:
      turn_deg: [-50.0, 50.0]
      vertical_step_m: [-0.55, 0.55]
      hard_turn_probability: 0.32
      hard_turn_deg: [-70.0, 70.0]

trajectory:
  approach_distance_m: 5.0
  exit_distance_m: 3.0
  path_lateral_offset_m: 0.55
  path_vertical_offset_m: 0.40
  path_dense_samples: 3072
  camera_lookahead_m: 4.5
  target_gate_look_blend: 0.58
  gate_pass_margin_m: 0.40

motion:
  profile_probabilities:
    slow: 0.15
    medium: 0.35
    fast: 0.35
    aggressive: 0.15

  max_frames_per_sequence: 700
  speed_event_count_range: [1, 5]

  profiles:
    slow:
      cruise_speed_mps_range: [1.5, 3.0]
      accel_limit_mps2_range: [1.0, 2.5]
      speed_variation_fraction_range: [0.12, 0.28]
      orientation_jitter_deg_range: [3.0, 6.0]
      turn_slowdown_strength: 2.8
      min_speed_mps: 0.8
      max_speed_mps: 4.0
      start_speed_fraction: 0.65
    medium:
      cruise_speed_mps_range: [3.0, 5.5]
      accel_limit_mps2_range: [2.0, 4.5]
      speed_variation_fraction_range: [0.12, 0.30]
      orientation_jitter_deg_range: [4.0, 8.0]
      turn_slowdown_strength: 2.4
      min_speed_mps: 1.5
      max_speed_mps: 7.0
      start_speed_fraction: 0.72
    fast:
      cruise_speed_mps_range: [5.5, 8.0]
      accel_limit_mps2_range: [3.5, 6.5]
      speed_variation_fraction_range: [0.10, 0.26]
      orientation_jitter_deg_range: [5.0, 10.0]
      turn_slowdown_strength: 2.0
      min_speed_mps: 3.0
      max_speed_mps: 10.0
      start_speed_fraction: 0.78
    aggressive:
      cruise_speed_mps_range: [7.5, 11.0]
      accel_limit_mps2_range: [5.0, 9.0]
      speed_variation_fraction_range: [0.15, 0.35]
      orientation_jitter_deg_range: [8.0, 15.0]
      turn_slowdown_strength: 1.7
      min_speed_mps: 4.0
      max_speed_mps: 13.0
      start_speed_fraction: 0.82

split:
  train: 0.80
  validation: 0.10
  test: 0.10

