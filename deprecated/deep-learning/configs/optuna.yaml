study_name: gateperceiver_v1
storage: null
base_config: configs/baseline.yaml
n_trials: 20
trial_epochs: 15
n_startup_trials: 5
n_warmup_epochs: 3

search_space:
  training.lr:
    type: float
    low: 0.00002
    high: 0.0005
    log: true
  training.weight_decay:
    type: float
    low: 0.000001
    high: 0.005
    log: true
  loss.mask_weight:
    type: float
    low: 1.5
    high: 5.0
  loss.keypoint_weight:
    type: float
    low: 0.75
    high: 4.0
  loss.translation_weight:
    type: float
    low: 0.75
    high: 4.0
  loss.rotation_weight:
    type: float
    low: 0.5
    high: 3.0
  loss.visibility_weight:
    type: float
    low: 0.25
    high: 1.5
  loss.track_weight:
    type: float
    low: 0.05
    high: 0.8
  decode.detection_threshold:
    type: float
    low: 0.3
    high: 0.7
