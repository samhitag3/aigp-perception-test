[project]
name = "gateperceiver"
version = "0.1.0"
description = "Canonical multi-task temporal neural network for UAV gate perception"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "tqdm>=4.66",
  "opencv-python-headless>=4.9"
]

[project.optional-dependencies]
tune = ["optuna>=3.6"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateperceiver"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
