[project]
name = "gateposenet-canonical"
version = "0.1.0"
description = "Temporal multi-gate perception model for the Canonical UAV Gate Perception Dataset/Output Contract v1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "torchvision>=0.19",
  "opencv-python>=4.10",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
tune = ["optuna>=4.0", "pandas>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatepose"]

[tool.ruff]
line-length = 110
